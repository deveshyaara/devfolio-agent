[project]
name = "devfolio-agent"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "python-dotenv>=1.2,<2", "requests>=2.32.5,<3", "streamlit>=1.56,<2",
  "langchain-core>=1.3.2,<2", "langchain-google-genai>=4.2.4,<5", "langgraph>=1.2.2,<2",
  "google-genai>=1.72,<2", "psycopg[binary,pool]>=3.3.3,<4",
  "fastapi>=0.135.1,<1", "uvicorn>=0.42,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable migrated database"]

[tool.ruff]
line-length = 110
target-version = "py312"
include = ["agent.py", "app.py", "health.py", "devfolio/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
