name: Sync portfolio knowledge
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      activate_index:
        description: Activate a completely built embedding profile
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: portfolio-knowledge-writer
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m 'not postgres'
      - name: Incremental synchronization
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_SYNC_DB_URL: ${{ secrets.SUPABASE_SYNC_DB_URL }}
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || github.token }}
          GITHUB_USERNAME: ${{ vars.PORTFOLIO_GITHUB_USERNAME }}
          PORTFOLIO_TOPIC: ${{ vars.PORTFOLIO_TOPIC || 'portfolio' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'gemini-embedding-2' }}
          EMBEDDING_VERSION: ${{ vars.EMBEDDING_VERSION || '2026-04' }}
          EMBEDDING_DIMENSIONS: ${{ vars.EMBEDDING_DIMENSIONS || '768' }}
          ACTIVATE: ${{ inputs.activate_index && 'true' || 'false' }}
        shell: bash
        run: |
          args=()
          if [ "$ACTIVATE" = true ]; then args+=(--activate-index); fi
          uv run --frozen python -m devfolio.sync "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: sync-report.json
          if-no-files-found: warn
          retention-days: 14
