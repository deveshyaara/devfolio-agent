name: Code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
      - run: uv sync --frozen --group dev
      - run: uv pip check
      - run: uv run --frozen --group dev ruff check .
      - run: uv run --frozen --group dev ruff format --check .
